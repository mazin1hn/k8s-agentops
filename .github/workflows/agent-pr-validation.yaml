name: Agent PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "helm/**"
      - "agentops/**"
      - ".github/workflows/agent-pr-validation.yaml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent-generated change
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "v3.18.4"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate AgentOps Python
        run: |
          python -m compileall agentops

      - name: Helm lint
        run: |
          helm lint helm/eks-app

      - name: Render Helm chart
        run: |
          helm template eks-app helm/eks-app > rendered.yaml

      - name: Agent policy checks
        run: |
          python agentops/scripts/policy_check.py rendered.yaml

      - name: Verify no direct cluster mutation
        run: |
          if grep -R -E \
            "kubectl (apply|delete|patch|replace)|helm (install|upgrade|uninstall)" \
            agentops/; then
            echo "Direct cluster mutation command found in AgentOps code."
            exit 1
          fi

          echo "No direct cluster mutation commands detected."