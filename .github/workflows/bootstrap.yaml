name: Deploy Bootstrap

on:
 workflow_dispatch:
   inputs:
     choice:
      description: "Type 'confirm' to deploy bootstrap"
      required: true 
      type: string 
      default: ""
 
jobs:
  build:
    if: ${{ github.event.inputs.choice == 'confirm' }}
    runs-on: ubuntu-latest

    permissions:
     id-token: write
     contents: read

    steps: 
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform 
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init 
      working-directory: infra/bootstrap
      run: terraform init 

    - name: Setup Terraform Lint 
      uses: terraform-linters/setup-tflint@v6

    - name: Terraform fmt
      working-directory: infra/bootstrap
      run: terraform fmt --recursive

    - name: Terraform validate
      working-directory: infra/bootstrap
      run: terraform validate 

    - name: Run Terraform Lint 
      working-directory: infra/bootstrap
      run: tflint -f compact 

    - name: Run Checkov
      id: checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ./infra/bootstrap
        framework: terraform
        output_format: cli
        soft_fail: true

    - name: Configure AWS Credentials 
      uses: aws-actions/configure-aws-credentials@v4
      with:
       role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE }}
       aws-region: eu-west-2
  
    - name: Terraform Plan 
      working-directory: infra/bootstrap
      run: terraform plan

    - name: Terraform Apply 
      working-directory: infra/bootstrap
      run: terraform apply -auto-approve

    - name: Notify success
      if: success()
      run: echo Success! Your bootstrap has been deployed!