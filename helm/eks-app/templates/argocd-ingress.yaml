apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    external-dns.alpha.kubernetes.io/hostname: argocd.mazin1hn.uk

spec:
  ingressClassName: traefik

  rules:
    - host: argocd.mazin1hn.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80

  tls:
    - hosts:
        - argocd.mazin1hn.uk
      secretName: argocd-tls